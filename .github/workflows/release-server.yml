name: Release Server

on:
  push:
    tags:
      - 'server-v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Server (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build release binary
        working-directory: server
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o locatorr-server .

      - name: Create tarball
        run: |
          tar -czf locatorr-server-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz \
            -C server locatorr-server

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            locatorr-server-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  push-docker:
    name: Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            clempera8/locatorr-server:latest
            clempera8/locatorr-server:${{ github.ref_name }}
