name: tauri-ci

on:
  push:
    paths:
      - "src-tauri/**"
      - "crypto-core/**"
      - ".github/workflows/tauri-ci.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "crypto-core/**"
      - ".github/workflows/tauri-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      # Standard Tauri v2 Linux build dependencies (webview + AppIndicator + SVG icon support).
      # This is the commonly published list for tauri-action-style CI; if a package name has
      # drifted on the runner's Ubuntu version, CI failing here is exactly the signal to fix it,
      # not a guess to pre-empt.
      - name: install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: cargo fmt --check

      - name: build
        run: cargo build --verbose 2>&1 | tee /tmp/build.log

      - name: test
        run: cargo test --verbose 2>&1 | tee /tmp/test.log

      - name: clippy
        run: cargo clippy -- -D warnings 2>&1 | tee /tmp/clippy.log

      - name: report failure as commit comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const candidates = ['/tmp/build.log', '/tmp/test.log', '/tmp/clippy.log'];
            let logPath = null;
            for (const c of candidates) {
              if (fs.existsSync(c) && fs.statSync(c).size > 0) logPath = c;
            }
            if (!logPath) return;
            let logText = fs.readFileSync(logPath, 'utf8');
            if (logText.length > 60000) logText = logText.slice(-60000);
            const step = logPath.split('/').pop().replace('.log', '');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `tauri-ci failed at \`${step}\`:\n\n\`\`\`\n${logText}\n\`\`\``,
            });
