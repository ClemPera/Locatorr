name: frontend-ci

on:
  push:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "svelte.config.js"
      - "vite.config.js"
      - "tsconfig.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "svelte.config.js"
      - "vite.config.js"
      - "tsconfig.json"
      - ".github/workflows/frontend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
